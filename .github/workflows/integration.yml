on: [push, pull_request]

name: build, tests, rustfmt, clippy

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libsdl3-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libsdl3-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Cache test ROMs
        id: cache-test-roms
        uses: actions/cache@v4
        with:
          path: test-roms
          key: game-boy-test-roms-v7.0
      - name: Download test ROMs
        if: steps.cache-test-roms.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip -o test-roms.zip
          unzip -q test-roms.zip -d test-roms
      - name: Place test ROMs
        run: |
          BLARGG=$(find test-roms -maxdepth 2 -type d -name blargg)
          MOONEYE=$(find test-roms -maxdepth 3 -type d -name acceptance)
          mkdir -p tests/blargg/roms tests/mooneye/roms
          cp -r "$BLARGG"/. tests/blargg/roms/
          cp -r "$MOONEYE"/. tests/mooneye/roms/
      - run: cargo nextest run

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libsdl3-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  build-libretro:
    name: Build libretro core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p gameman-libretro
      - name: Stage core with RetroArch-compatible filename
        # Cargo emits `libgameman_libretro.so`, but RetroArch matches the
        # `.info` file by exact basename, so the `lib` prefix must be dropped.
        run: |
          mkdir -p dist
          cp target/release/libgameman_libretro.so dist/gameman_libretro.so
          cp gameman-libretro/gameman_libretro.info dist/gameman_libretro.info
      - uses: actions/upload-artifact@v4
        with:
          name: gameman-libretro
          path: |
            dist/gameman_libretro.so
            dist/gameman_libretro.info

  release:
    name: Release libretro core
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, fmt, clippy, build-libretro]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download libretro artifact
        uses: actions/download-artifact@v4
        with:
          name: gameman-libretro
          path: dist
      - name: Package release zip
        # Bundle the core (.so → cores dir) and its info file (.info → info
        # dir) so users get everything in one download.
        run: |
          cd dist
          zip gameman_libretro-linux-x86_64.zip gameman_libretro.so gameman_libretro.info
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gameman_libretro-linux-x86_64.zip
