on: [push, pull_request]

name: build, tests, rustfmt, clippy

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Cache test ROMs
        id: cache-test-roms
        uses: actions/cache@v4
        with:
          path: |
            tests/blargg/roms
            tests/mooneye/roms
          key: test-roms-lp-blargg-master-csp-mooneye-v7.0
      - name: Download and place blargg ROMs
        if: steps.cache-test-roms.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/L-P/blargg-test-roms/archive/refs/heads/master.zip -o blargg.zip
          unzip -q blargg.zip -d blargg-src
          mkdir -p tests/blargg/roms
          cp -r blargg-src/blargg-test-roms-master/. tests/blargg/roms/
          # Flatten cpu_instrs/individual/ → cpu_instrs/
          cp tests/blargg/roms/cpu_instrs/individual/*.gb tests/blargg/roms/cpu_instrs/
          # Flatten mem_timing-2/rom_singles/ → mem_timing-2/
          cp tests/blargg/roms/mem_timing-2/rom_singles/*.gb tests/blargg/roms/mem_timing-2/
          # Copy combined dmg_sound.gb into rom_singles/
          cp tests/blargg/roms/dmg_sound/dmg_sound.gb tests/blargg/roms/dmg_sound/rom_singles/
          # Lift halt_bug.gb up one level
          cp tests/blargg/roms/halt_bug/halt_bug.gb tests/blargg/roms/
      - name: Download and place mooneye ROMs
        if: steps.cache-test-roms.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/c-sp/game-boy-test-roms/releases/download/v7.0/game-boy-test-roms-v7.0.zip -o csp.zip
          unzip -q csp.zip -d csp-src
          mkdir -p tests/mooneye/roms
          MOONEYE=$(find csp-src -maxdepth 3 -type d -path "*/mooneye-test-suite/acceptance")
          cp -r "$MOONEYE"/. tests/mooneye/roms/
      - run: cargo nextest run --no-default-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --no-default-features -- -D warnings

  build-libretro:
    name: Build libretro core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p gameman-libretro
      - name: Stage core with RetroArch-compatible filename
        # Cargo emits `libgameman_libretro.so`, but RetroArch matches the
        # `.info` file by exact basename, so the `lib` prefix must be dropped.
        run: |
          mkdir -p dist
          cp target/release/libgameman_libretro.so dist/gameman_libretro.so
          cp gameman-libretro/gameman_libretro.info dist/gameman_libretro.info
      - uses: actions/upload-artifact@v4
        with:
          name: gameman-libretro
          path: |
            dist/gameman_libretro.so
            dist/gameman_libretro.info

  build-libretro-android:
    name: Build libretro core (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build for Android arm64
        run: |
          LINKER=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER \
            cargo build --release -p gameman-libretro --target aarch64-linux-android
      - name: Stage core with RetroArch-compatible filename
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/libgameman_libretro.so dist/gameman_libretro.so
          cp gameman-libretro/gameman_libretro.info dist/gameman_libretro.info
      - uses: actions/upload-artifact@v4
        with:
          name: gameman-libretro-android-arm64
          path: |
            dist/gameman_libretro.so
            dist/gameman_libretro.info

  release:
    name: Release libretro core
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, fmt, clippy, build-libretro, build-libretro-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: gameman-libretro
          path: dist/linux
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: gameman-libretro-android-arm64
          path: dist/android
      - name: Package release zips
        run: |
          cd dist/linux
          zip ../gameman_libretro-linux-x86_64.zip gameman_libretro.so gameman_libretro.info
          cd ../android
          zip ../gameman_libretro-android-arm64.zip gameman_libretro.so gameman_libretro.info
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gameman_libretro-linux-x86_64.zip
            dist/gameman_libretro-android-arm64.zip
